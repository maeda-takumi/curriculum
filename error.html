<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接続エラー</title>
  <style>
    :root {
      color-scheme: light;
      --bg-start: #f7fbff;
      --bg-end: #eef4ff;
      --card-bg: rgba(255, 255, 255, 0.92);
      --text: #1f2937;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --shadow: 0 24px 60px rgba(37, 99, 235, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(96, 165, 250, 0.24), transparent 34%),
        linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(100%, 520px);
      padding: 42px 32px;
      border: 1px solid rgba(37, 99, 235, 0.12);
      border-radius: 28px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .icon {
      display: inline-grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin-bottom: 22px;
      border-radius: 24px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 36px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.55rem, 4vw, 2rem);
      letter-spacing: 0.02em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 3vw, 1.08rem);
      font-weight: 600;
    }

    @media (max-width: 480px) {
      main {
        padding: 34px 22px;
        border-radius: 22px;
      }

      .icon {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="error-title">
    <div class="icon" aria-hidden="true">!</div>
    <h1 id="error-title">接続エラー</h1>
    <p>接続エラーが発生しました。URLから再度ログインしてください。</p>
  </main>
</body>
</html>
